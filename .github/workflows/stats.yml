name: Refresh stats strip

# Re-fetches the real numbers and re-renders the strip. Renders are
# byte-deterministic, so a day with no new activity commits nothing.

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --quiet fonttools brotli

      - name: Fetch the numbers
        env:
          # A PAT with repo + read:user also counts private repos. Without it
          # the run still works, on public data only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python build/stats.py

      - name: Re-render
        run: python build/strip.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets build/data; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets build/data
          git commit -m "Refresh stats strip"
          git push

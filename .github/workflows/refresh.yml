name: Refresh profile panels

# Pulls live contribution and language data, re-renders the SVG panels, and
# commits only when the rendered bytes actually changed. Renders are
# deterministic, so a quiet day is a clean no-op.

on:
  schedule:
    - cron: "17 6 * * *"       # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-panels
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --quiet fonttools brotli

      - name: Pull live data
        env:
          # PROFILE_TOKEN (a PAT with repo + read:user) also counts private
          # repos and private contributions. Without it the run still works,
          # just on public data only.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python build/live.py

      - name: Render panels
        run: python build/render.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets build/data; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets build/data
          git commit -m "Refresh profile panels from live data"
          git push

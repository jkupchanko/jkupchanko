name: Generate contribution snake

# Renders the contribution graph as an animated snake and commits the SVG to
# an `output` branch. Self-generated on purpose: the popular hosted widgets
# (github-readme-stats, github-readme-activity-graph) are third-party services
# that go down, and a dead service shows as a broken image on the profile.
# This one is a real file in the repo.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=%238A5A2B&color_dots=%23F0EAE0,%23E0CDAE,%23C99F63,%23A8762F,%238A5A2B
            dist/snake-dark.svg?color_snake=%23C98A4B&color_dots=%231E1A16,%233A2E22,%235C4526,%238A6432,%23C98A4B

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
